# CORS 配置错误检测规则
# 最常见的 API 安全配置问题之一
name: cors_misconfig
description: CORS Misconfiguration — 跨域资源共享配置错误
severity: medium
owasp: "API7:2023 — Security Misconfiguration"
confidence: 0.9
enabled: true

endpoint_filter:
  methods: [GET, POST, PUT, DELETE, OPTIONS]
  param_types: [header]

payloads:
  # Origin 反射型 CORS
  - value: "https://evil.com"
    description: "Origin 头设置为恶意域名 — 测试是否被反射回 Access-Control-Allow-Origin"
  - value: "https://attacker.com"
    description: "Origin 设置为攻击者域名"
  - value: "null"
    description: "Origin=null — 本地文件和沙箱 iframe 的 Origin"
  # Origin 前缀绕过
  - value: "https://target.com.evil.com"
    description: "Origin 后缀匹配绕过 — 检测是否只做了 contains 检查"
  - value: "https://evil-target.com"
    description: "Origin 包含目标域名 — 部分匹配绕过"
  # 通配符 + 凭证
  - value: "https://evil.com (with Credentials)"
    description: "测试 Access-Control-Allow-Origin: * 时是否同时允许 Credentials"
  # 子域名劫持
  - value: "https://sub.target.com.attacker.net"
    description: "Origin 子域名欺骗"

exploit_indicator:
  patterns:
    - "Access-Control-Allow-Origin: \\*"
    - "Access-Control-Allow-Credentials: true"
  status_codes: [200, 204]

expected_normal: >-
  CORS 应使用白名单精确匹配 Origin；不应反射任意 Origin；不应同时设置 Allow-Origin:* 和 Allow-Credentials:true
reasoning_template: "CORS 配置测试: Origin={payload_value}"
